[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-app"
version = "0.1.0"
description = "Trading bot application with clean architecture"
requires-python = ">=3.11"
dependencies = [
    "kucoin-python>=1.0.26",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_bot*", "scripts*", "dashboard*"]
exclude = ["tests*", "data*", "config*", "models*", "notebooks*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "integration: tests that call external services or require network access"
]
